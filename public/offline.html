<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ритм — нет сети</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #0a0a0a;
        color: #fafafa;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      p { color: #a1a1aa; margin: 0; }
      button {
        margin-top: 12px;
        height: 48px;
        padding: 0 24px;
        border: 0;
        border-radius: 12px;
        background: #fafafa;
        color: #0a0a0a;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <h1 style="margin: 0">Нет сети</h1>
    <p>Ритм хранит данные в облаке, поэтому без интернета записи не открыть.</p>
    <button onclick="location.reload()">Попробовать снова</button>
  </body>
</html>
